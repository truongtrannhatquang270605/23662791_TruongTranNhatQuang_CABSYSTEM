openapi: 3.0.3

info:
  title: CAB System - Driver API
  description: API quản lý tài xế
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Drivers
    description: Quản lý tài xế

paths:

  /drivers:

    get:
      tags:
        - Drivers
      summary: Lấy danh sách tài xế
      operationId: getDrivers

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lấy danh sách tài xế thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverResponse'

        '401':
          description: Chưa xác thực

        '500':
          description: Lỗi máy chủ

    post:
      tags:
        - Drivers
      summary: Tạo tài khoản tài xế
      operationId: createDriver

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'

      responses:
        '201':
          description: Tạo tài khoản tài xế thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'

        '400':
          description: Dữ liệu không hợp lệ

        '409':
          description: Email hoặc số điện thoại đã tồn tại

        '500':
          description: Lỗi máy chủ

  /drivers/{driverId}:

    get:
      tags:
        - Drivers
      summary: Lấy thông tin tài xế
      operationId: getDriverById

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/DriverId'

      responses:
        '200':
          description: Lấy thông tin tài xế thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'

        '401':
          description: Chưa xác thực

        '404':
          description: Không tìm thấy tài xế

    put:
      tags:
        - Drivers
      summary: Cập nhật thông tin tài xế
      operationId: updateDriver

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/DriverId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverRequest'

      responses:
        '200':
          description: Cập nhật tài xế thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'

        '400':
          description: Dữ liệu không hợp lệ

        '401':
          description: Chưa xác thực

        '404':
          description: Không tìm thấy tài xế

        '409':
          description: Email hoặc số điện thoại đã tồn tại

    delete:
      tags:
        - Drivers
      summary: Xóa tài xế
      operationId: deleteDriver

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/DriverId'

      responses:
        '204':
          description: Xóa tài xế thành công

        '401':
          description: Chưa xác thực

        '404':
          description: Không tìm thấy tài xế

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    DriverId:
      name: driverId
      in: path
      required: true
      description: ID tài xế
      schema:
        type: integer
        format: int64
        example: 1

  schemas:

    DriverResponse:
      type: object
      properties:
        driver_id:
          type: integer
          format: int64
          example: 1

        full_name:
          type: string
          example: Tran Van B

        phone:
          type: string
          example: "0912345678"

        email:
          type: string
          format: email
          example: tranvanb@gmail.com

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - BLOCKED
          example: ACTIVE

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time

    CreateDriverRequest:
      type: object
      required:
        - full_name
        - phone
        - email
        - password

      properties:

        full_name:
          type: string
          example: Tran Van B

        phone:
          type: string
          example: "0912345678"

        email:
          type: string
          format: email
          example: tranvanb@gmail.com

        password:
          type: string
          format: password
          minLength: 8
          example: "Password123!"

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - BLOCKED
          default: ACTIVE

    UpdateDriverRequest:
      type: object
      properties:

        full_name:
          type: string

        phone:
          type: string

        email:
          type: string
          format: email

        password:
          type: string
          format: password

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - BLOCKED
