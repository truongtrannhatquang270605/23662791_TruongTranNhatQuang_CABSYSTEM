openapi: 3.0.3

info:
  title: CAB System - Trip API
  description: API quản lý và theo dõi chuyến xe
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Trips
    description: Quản lý chuyến xe

paths:

  /trips:

    get:
      tags:
        - Trips
      summary: Lấy danh sách chuyến
      operationId: getTrips

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lấy danh sách chuyến thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripResponse'

        '401':
          description: Chưa xác thực

  /trips/{tripId}:

    get:
      tags:
        - Trips
      summary: Xem chi tiết chuyến
      operationId: getTripById

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/TripId'

      responses:
        '200':
          description: Lấy thông tin chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

        '404':
          description: Không tìm thấy chuyến

    put:
      tags:
        - Trips
      summary: Cập nhật trạng thái chuyến
      operationId: updateTripStatus

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/TripId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripStatusRequest'

      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

        '400':
          description: Trạng thái không hợp lệ

        '403':
          description: Tài xế không được phép cập nhật chuyến

        '404':
          description: Không tìm thấy chuyến

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1001

  schemas:

    TripResponse:
      type: object
      properties:

        trip_id:
          type: integer
          example: 1001

        booking_id:
          type: integer
          example: 5001

        customer_id:
          type: integer
          example: 1

        driver_id:
          type: integer
          example: 10

        vehicle_id:
          type: integer
          example: 20

        pickup_location:
          type: string
          example: "Đại học Công nghiệp TP.HCM"

        destination:
          type: string
          example: "Sân bay Tân Sơn Nhất"

        status:
          type: string
          enum:
            - SEARCHING_DRIVER
            - DRIVER_ASSIGNED
            - DRIVER_ARRIVED
            - PICKED_UP
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          example: IN_PROGRESS

        created_at:
          type: string
          format: date-time

        completed_at:
          type: string
          format: date-time
          nullable: true

    UpdateTripStatusRequest:
      type: object
      required:
        - status

      properties:

        status:
          type: string
          enum:
            - DRIVER_ARRIVED
            - PICKED_UP
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED

          example: DRIVER_ARRIVED
