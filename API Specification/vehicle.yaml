openapi: 3.0.3

info:
  title: CAB System - Vehicle API
  description: API quản lý phương tiện của tài xế
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Vehicles
    description: Quản lý phương tiện

paths:

  /vehicles:

    get:
      tags:
        - Vehicles
      summary: Lấy danh sách phương tiện
      operationId: getVehicles

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lấy danh sách phương tiện thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleResponse'

        '401':
          description: Chưa xác thực

    post:
      tags:
        - Vehicles
      summary: Tạo phương tiện
      operationId: createVehicle

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'

      responses:
        '201':
          description: Tạo phương tiện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'

        '400':
          description: Dữ liệu không hợp lệ

        '409':
          description: Biển số xe đã tồn tại

  /vehicles/{vehicleId}:

    get:
      tags:
        - Vehicles
      summary: Lấy thông tin phương tiện
      operationId: getVehicleById

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/VehicleId'

      responses:
        '200':
          description: Lấy thông tin phương tiện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'

        '404':
          description: Không tìm thấy phương tiện

    put:
      tags:
        - Vehicles
      summary: Cập nhật phương tiện
      operationId: updateVehicle

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/VehicleId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleRequest'

      responses:
        '200':
          description: Cập nhật phương tiện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'

        '400':
          description: Dữ liệu không hợp lệ

        '404':
          description: Không tìm thấy phương tiện

        '409':
          description: Biển số xe đã tồn tại

    delete:
      tags:
        - Vehicles
      summary: Xóa phương tiện
      operationId: deleteVehicle

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/VehicleId'

      responses:
        '204':
          description: Xóa phương tiện thành công

        '404':
          description: Không tìm thấy phương tiện

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1

  schemas:

    VehicleResponse:
      type: object
      properties:

        vehicle_id:
          type: integer
          example: 1

        driver_id:
          type: integer
          example: 10

        plate_number:
          type: string
          example: "51A-12345"

        vehicle_type:
          type: string
          enum:
            - CAR_4_SEATS
            - CAR_7_SEATS
          example: CAR_4_SEATS

        brand:
          type: string
          example: Toyota

        model:
          type: string
          example: Vios

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          example: ACTIVE

    CreateVehicleRequest:
      type: object
      required:
        - driver_id
        - plate_number
        - vehicle_type
        - brand
        - model

      properties:

        driver_id:
          type: integer
          example: 10

        plate_number:
          type: string
          example: "51A-12345"

        vehicle_type:
          type: string
          enum:
            - CAR_4_SEATS
            - CAR_7_SEATS

        brand:
          type: string
          example: Toyota

        model:
          type: string
          example: Vios

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          default: ACTIVE

    UpdateVehicleRequest:
      type: object
      properties:

        plate_number:
          type: string

        vehicle_type:
          type: string
          enum:
            - CAR_4_SEATS
            - CAR_7_SEATS

        brand:
          type: string

        model:
          type: string

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
